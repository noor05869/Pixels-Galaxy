version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - node -e "const required=['NEXT_PUBLIC_SITE_URL','SUPABASE_URL','SUPABASE_SECRET_KEY','RESEND_API_KEY','ORDER_NOTIFICATION_EMAIL','ORDER_FROM_EMAIL','ORDER_CLIENT_IP_HEADER','ADMIN_CLIENT_IP_HEADER','ADMIN_PASSWORD_HASH','ADMIN_SESSION_SECRET']; const missing=required.filter((name)=>!process.env[name]); if(missing.length){console.error('Missing required Amplify environment variables:',missing.join(', ')); process.exit(1)}"
        - env | grep -E '^(NEXT_PUBLIC_SITE_URL|NEXT_PUBLIC_WHATSAPP_NUMBER|SUPABASE_URL|SUPABASE_SECRET_KEY|RESEND_API_KEY|ORDER_NOTIFICATION_EMAIL|ORDER_FROM_EMAIL|ORDER_CLIENT_IP_HEADER|ADMIN_CLIENT_IP_HEADER|ADMIN_PASSWORD_HASH|ADMIN_SESSION_SECRET)=' > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
